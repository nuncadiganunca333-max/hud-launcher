name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee build.log
      - name: Publish build log on failure
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: buildlog-${{ github.run_number }}
          name: build log ${{ github.run_number }}
          prerelease: true
          files: build.log
      - name: Rename
        run: cp app/build/outputs/apk/debug/app-debug.apk HUD-Launcher.apk
      - uses: actions/upload-artifact@v4
        with:
          name: HUD-Launcher
          path: HUD-Launcher.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: HUD Launcher build ${{ github.run_number }}
          files: HUD-Launcher.apk
